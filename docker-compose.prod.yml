version: '3.8'

# Production Docker Compose for Zeta CMS
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zeta-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zetadb}
      POSTGRES_USER: ${POSTGRES_USER:-zeta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./data-export/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backup:/backup
    ports:
      - "5432:5432"
    networks:
      - zeta-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeta_user} -d ${POSTGRES_DB:-zetadb}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: zeta-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    ports:
      - "6379:6379"
    networks:
      - zeta-network-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zeta-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-zeta_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zetadb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/webp,application/pdf}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - backend_uploads_prod:/app/uploads
      - ./logs:/app/logs
    ports:
      - "4000:4000"
    networks:
      - zeta-network-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Frontend
  frontend:
    build:
      context: ./builder-orbit-lab-main
      dockerfile: Dockerfile
    container_name: zeta-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-Zeta CMS}
    ports:
      - "8080:8080"
    networks:
      - zeta-network-prod
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zeta-nginx-prod
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_uploads_prod:/var/www/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - zeta-network-prod
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Database Backup Service
  backup:
    image: postgres:15-alpine
    container_name: zeta-backup-prod
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup:/backup
      - postgres_data_prod:/var/lib/postgresql/data:ro
    networks:
      - zeta-network-prod
    depends_on:
      - postgres
    command: |
      sh -c "
        echo 'Starting backup service...'
        while true; do
          echo 'Creating backup at $$(date)'
          pg_dump -h postgres -U ${POSTGRES_USER:-zeta_user} -d ${POSTGRES_DB:-zetadb} > /backup/zetadb_$$(date +%Y%m%d_%H%M%S).sql
          echo 'Backup completed at $$(date)'
          # Keep only last 30 days of backups
          find /backup -name 'zetadb_*.sql' -mtime +30 -delete
          sleep 86400
        done
      "

  # Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: zeta-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - zeta-network-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: zeta-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - zeta-network-prod
    depends_on:
      - prometheus

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  backend_uploads_prod:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  zeta-network-prod:
    driver: bridge
